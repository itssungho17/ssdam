# SSDAM Quest Seed Schema (v1.0.0)

idea_validation:
  status: PASS
  checks:
    has_goal: boolean
    has_testable_outcome: boolean
    is_actionable: boolean

metadata:
  quest_id: string
  quest_name: string
  quest_owner: string
  domain: string
  timestamp: string

goal:
  statement: string
  success_criteria:
    - id: string
      description: string
  out_of_scope:
    - string

requirements:
  - id: string
    statement: string
    priority: string

stages:
  - id: string
    name: string
    purpose: string
    key_artifact: string
    mapped_requirements:
      - string

constraints:
  timeline: string
  budget: string
  backend_stack: string
  frontend_stack: string
  project_root: string
  ssdam_root: string
  team: string
  risks:
    - string
  existing_artifacts:
    - name: string
      location: string
      relevance: string

handoff:
  next_template: string
  payload:
    quest_id: string
    quest_owner: string
    quest_goal: string
    domain: string
    stage_list:
      - string
    requirement_ids:
      - string

self_validation:
  goal_is_testable: boolean
  all_requirements_pass_fail: boolean
  all_requirements_mapped: boolean
  all_stages_single_purpose: boolean
  handoff_complete: boolean
  no_vague_terms: boolean
  constraints_filled: boolean
