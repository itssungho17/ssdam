# SSDAM Execution Plan
# source_template: execution-plan.template
# schema_version: v0.2.0
# input_files: [stage-spec.STG-01.yaml, quest-seed.yaml]

metadata:
  quest_id: "QST-20260216-001"
  stage_id: "STG-01"
  stage_name: "소유 자료 3Depth 조회·상세 보기"
  document_id: execution-plan
  version: "v0.1.0"
  timestamp: "2026-02-17T19:00:00+09:00"
  requirement_ids: [REQ-001, REQ-002, REQ-003]

tech_stack:
  backend: "Spring Boot + PostgreSQL"
  frontend: "Svelte"
  project_root: "/project"

tasks:
  - task_id: "TASK-01"
    task_name: "아키텍처 설계"
    task_type: "architecture"
    description: >-
      STG-01 범위(소유 자료 3Depth 탐색 UI/상세 보기, 통합 소유 자료 조회 API, 최소 DB 스키마)를
      기준으로 시스템/모듈 경계, 데이터 흐름, API 계약 초안(OpenAPI 포함), 권한/숨김 제외 규칙,
      테스트 전략(백엔드 통합 테스트 및 E2E)을 아키텍처 관점에서 확정한다.
      quest-seed에서 project_root가 undefined이므로 본 계획에서는 임시로 /project를 사용한다.
    target_artifacts: [ART-STG-01-001, ART-STG-01-002, ART-STG-01-003]
    dependencies: []
    output_files:
      - "/project/docs/"
    tech_context: >-
      백엔드: Spring Boot, PostgreSQL / 프론트엔드: Svelte /
      문서화: OpenAPI, 아키텍처 다이어그램(선택), 테스트 전략(Playwright 또는 Cypress, JUnit)
    acceptance_criteria: >-
      /project/docs/ 하위에 STG-01 아키텍처 산출물이 생성되어 있으며(예: 설계 문서 1개 이상),
      포함 항목으로 (1) 모듈/레이어 경계, (2) 3Depth 탐색 데이터 모델 개요,
      (3) API 엔드포인트 목록 및 요청/응답 스키마 초안, (4) 숨김 제외 및 소유 통합 규칙,
      (5) 테스트 범위(E2E/통합) 정의가 명시되어 있다.

  - task_id: "TASK-02"
    task_name: "ERD 설계"
    task_type: "erd"
    description: "3Depth(폴더→하위폴더→자료) 및 사용자 소유 상태/숨김 여부를 표현하는 ERD를 Mermaid로 작성한다."
    target_artifacts: [ART-STG-01-003]
    dependencies: [TASK-01]
    output_files:
      - "/project/erd/"
    tech_context: "Mermaid ERD 문법"
    acceptance_criteria: "ERD 파일이 /project/erd/ 하위에 존재하며 Mermaid 문법 오류 없이 렌더링된다."

  - task_id: "TASK-03"
    task_name: "DDL 작성"
    task_type: "ddl"
    description: "ERD를 기반으로 PostgreSQL 스키마를 생성하는 마이그레이션(예: Flyway)을 작성한다."
    target_artifacts: [ART-STG-01-003]
    dependencies: [TASK-02]
    output_files:
      - "/project/db/"
    tech_context: "PostgreSQL 마이그레이션(Flyway 또는 동등 도구)"
    acceptance_criteria: >-
      마이그레이션 파일이 /project/db/ 하위에 존재하고,
      로컬 환경에서 마이그레이션 실행이 오류 없이 완료된다(테이블/제약 생성 포함).

  - task_id: "TASK-04"
    task_name: "백엔드 구현"
    task_type: "backend"
    description: >-
      소유 자료 3Depth 트리 조회 및 자료 상세 조회 REST API를 구현하고,
      기본 제공 자료와 구매 자료를 통합 반환하며 숨김 자료를 제외하는 로직을 포함한다.
      백엔드 통합 테스트를 포함하고 OpenAPI 스펙 파일을 생성/갱신한다.
    target_artifacts: [ART-STG-01-002, ART-STG-01-003]
    dependencies: [TASK-03]
    output_files:
      - "/project/backend/"
      - "/project/docs/"
    tech_context: "Spring Boot, PostgreSQL, JUnit(통합 테스트), OpenAPI 스펙"
    acceptance_criteria: >-
      백엔드 소스가 /project/backend/ 하위에 존재하고,
      (1) 3Depth 트리 조회 API 1개 이상, (2) 자료 상세 조회 API 1개 이상이 동작하며,
      (3) 통합 테스트가 실행 가능하고, (4) OpenAPI 스펙 문서가 /project/docs/ 하위에 생성되어 있다.

  - task_id: "TASK-05"
    task_name: "프론트엔드 구현"
    task_type: "frontend"
    description: >-
      Svelte 기반 소유 자료 페이지를 구현하여 3Depth 탐색(폴더/하위폴더/자료 선택)과
      더블클릭(또는 동등 상호작용) 기반 상세 보기(이미지 확대 또는 동영상 재생)를 제공한다.
      API 연동을 통해 숨김 자료를 제외한 통합 목록을 표시하며, 핵심 E2E 시나리오를 구성한다.
    target_artifacts: [ART-STG-01-001, ART-STG-01-002]
    dependencies: [TASK-04]
    output_files:
      - "/project/frontend/"
    tech_context: "Svelte, 프론트엔드 라우팅/상태관리(필요 시), E2E(Playwright 또는 Cypress)"
    acceptance_criteria: >-
      프론트엔드 소스가 /project/frontend/ 하위에 존재하고,
      (1) 3Depth 탐색이 가능하며, (2) 더블클릭(또는 동등 상호작용)으로 상세 보기 UI가 열리고,
      (3) 이미지 확대 또는 동영상 재생이 가능하며, (4) E2E 테스트가 실행 가능한 형태로 포함되어 있다.

task_flow:
  default_sequence: [TASK-01, TASK-02, TASK-03, TASK-04, TASK-05]
  parallel_groups: []

handoff:
  next_element: execution.template
  execution_unit: "task"
  total_executions: 5

self_validation:
  all_artifacts_covered: true
  task_dependencies_acyclic: true
  default_flow_complete: true
  tech_stack_specified: true
  all_paths_use_project_root: true
