# ============================================================
# task-spec.TSK-NNN.yaml — Output Template for new-task Skill
# ============================================================
#
# This file is GENERATED by the new-task AgentSkill.
# Do NOT edit this template directly.
#
# Actual output location:
#   .ssdam/{id}/output/task-spec.TSK-NNN.yaml
#
# One file is generated per Task. Run new-task once per TSK-NNN
# in the mission's task_list, in dependency order.
#
# This file feeds into the execution element chain:
#   task-spec.TSK-NNN.yaml → Execution → Artifact → Evaluation → Evidence → Checkpoint
#
# [AGENT]   = populated by the agent
# [DERIVED] = derived from mission-spec.yaml
# ============================================================


task_spec:

  # ----------------------------------------------------------
  # METADATA
  # ----------------------------------------------------------
  metadata:
    mission_id:     ""          # [DERIVED] from mission-spec.metadata.mission_id
    task_id:        ""          # [DERIVED] e.g., TSK-001
    task_name:      ""          # [DERIVED] from mission-spec.tasks[target].name
    task_owner:     ""          # [DERIVED] from mission-spec.governance.roles.task_owners
    requirement_ids: []         # [DERIVED] from mission-spec.tasks[target].requirements
    document_id:    "task-spec"
    version:        "v0.1.0"
    created_at:     ""          # [AGENT] ISO-8601 UTC
    schema_version: "1.0.0"


  # ----------------------------------------------------------
  # PURPOSE & SCOPE
  # ----------------------------------------------------------
  purpose:
    statement: ""               # [AGENT] Single testable sentence — WHAT this task achieves
    scope_included:             # [AGENT] What is explicitly part of this task
      - ""
    scope_excluded:             # [AGENT] What is explicitly NOT part of this task (boundaries)
      - ""


  # ----------------------------------------------------------
  # INPUT CONTRACT
  # ----------------------------------------------------------
  # First task in mission (no predecessors): input_item = "none", artifact_id = "none"
  # Other tasks: reference the predecessor task's output artifact(s)
  input_contract:
    - input_item:           ""  # [AGENT] Description of required input
      artifact_id:          ""  # [DERIVED] ART-TSK-NNN-NN from predecessor, or "none"
      contract_requirement: ""  # [AGENT] What the input must satisfy


  # ----------------------------------------------------------
  # OUTPUT CONTRACT
  # ----------------------------------------------------------
  # artifact_id format: ART-TSK-NNN-NN (e.g., ART-TSK-001-01)
  # Must cover everything in mission-spec.tasks[target].artifact.description
  output_contract:
    - output_artifact:       ""  # [AGENT] Short name of the artifact
      artifact_id:           ""  # [AGENT] e.g., ART-TSK-001-01
      contract_specification: "" # [AGENT] Format, structure, content — concrete and verifiable


  # ----------------------------------------------------------
  # EVALUATION CRITERIA
  # ----------------------------------------------------------
  # Each criterion must be binary PASS/FAIL decidable.
  # Forbidden: "generally good", "adequate", "appropriate".
  # criterion_id format: CRIT-01, CRIT-02, ...
  evaluation_criteria:
    - criterion_id:       "CRIT-01"
      criterion:          ""      # [AGENT] Specific, testable condition
      policy_reference:   ""      # [DERIVED] QPOL-NN from mission-spec.policies.quality
      measurement_method: ""      # [AGENT] automated test / manual verification / etc.
      pass_threshold:     ""      # [AGENT] Quantitative — e.g., "100% of tests pass"


  # ----------------------------------------------------------
  # CHECKPOINT
  # ----------------------------------------------------------
  checkpoint:
    checkpoint_id:               ""  # [DERIVED] CP-TSK-NNN from mission-spec
    gate_id:                     ""  # [DERIVED] GATE-TSK-NNN from mission-spec
    gate_type:                   ""  # [AGENT]  automatic | human | hybrid
    final_approver:              ""  # [DERIVED] from mission-spec.governance.roles.reviewers
    evaluation_policy_references: [] # [DERIVED] [QPOL-NN, ...]
    recovery_policy_reference:   ""  # [DERIVED] RPOL-NN from mission-spec.policies.recovery


  # ----------------------------------------------------------
  # RECOVERY MAPPING
  # ----------------------------------------------------------
  # Every FAIL path must have a recovery strategy.
  # recovery_strategy must be: retry | partial_fix | task_redesign
  recovery_mapping:
    - failure_type:      ""   # [AGENT] e.g., "First FAIL — transient error"
      rpol_reference:    ""   # [DERIVED] RPOL-NN from mission-spec.policies.recovery
      max_retry:         0    # [DERIVED] from mission-spec recovery strategy max_attempts
      recovery_strategy: ""   # retry | partial_fix | task_redesign
      escalation_trigger: ""  # [DERIVED] after N FAILs, escalate to escalation_target


  # ----------------------------------------------------------
  # EXECUTION PLAN
  # ----------------------------------------------------------
  # Decomposes the output_contract into concrete executable steps.
  # Apply the default flow (max 7 steps). Skip inapplicable steps.
  # Each step maps 1-to-1 to one execution skill in templetes/.
  # exec_type must exactly match the skill folder name.
  execution_plan:

    tech_stack:
      backend:      ""    # [DERIVED] from mission-spec.project_context or mission-input.yaml
      frontend:     ""    # [DERIVED] from mission-spec.project_context or mission-input.yaml
      database:     ""    # [DERIVED] from mission-spec.project_context or "undefined"
      project_root: ""    # [DERIVED] absolute path from mission-spec.project_context

    steps:
      # EXEC-01: Architecture Design — ALWAYS included (mandatory first step)
      - exec_id:           "EXEC-01"
        exec_name:         "Architecture Design"
        exec_type:         "architecture-design"
        description:       ""   # [AGENT] Module boundaries, component diagram, domain entities, API contract overview
        target_artifacts:  []   # [AGENT] artifact_ids from output_contract covered by this step
        dependencies:      []   # Always [] for first step
        output_files:      [".ssdam/{id}/output/design/architecture-design.TSK-NNN.md"]
        tech_context:      ""
        acceptance_criteria: ""

      # EXEC-02: Data Modeling — include if task involves DB entities
      - exec_id:           "EXEC-02"
        exec_name:         "Data Modeling"
        exec_type:         "data-modeling"
        description:       ""   # [AGENT] Domain entity definitions, relationships, Mermaid ERD
        target_artifacts:  []
        dependencies:      ["EXEC-01"]
        output_files:      [".ssdam/{id}/output/design/data-modeling.TSK-NNN.md"]
        tech_context:      ""
        acceptance_criteria: ""

      # EXEC-03: Schema Design — include if task involves DB schema changes (requires data-modeling)
      - exec_id:           "EXEC-03"
        exec_name:         "Schema Design"
        exec_type:         "schema-design"
        description:       ""   # [AGENT] DDL SQL for all entities defined in data-modeling output
        target_artifacts:  []
        dependencies:      ["EXEC-02"]
        output_files:      [".ssdam/{id}/output/design/schema-design.TSK-NNN.sql"]
        tech_context:      ""
        acceptance_criteria: ""

      # EXEC-04: Backend Design — include if task involves backend work (requires architecture-design)
      - exec_id:           "EXEC-04"
        exec_name:         "Backend Design"
        exec_type:         "backend-design"
        description:       ""   # [AGENT] API endpoint specs, service/repo layer, error handling, test strategy
        target_artifacts:  []
        dependencies:      ["EXEC-01"]   # if schema-design is present, set to ["EXEC-03"]
        output_files:      [".ssdam/{id}/output/design/backend-design.TSK-NNN.md"]
        tech_context:      ""
        acceptance_criteria: ""

      # EXEC-05: Backend Implementation — include if backend-design is included (requires backend-design)
      - exec_id:           "EXEC-05"
        exec_name:         "Backend Implementation"
        exec_type:         "backend-implementation"
        description:       ""   # [AGENT] Agent implements backend code in project_root per backend-design spec
        target_artifacts:  []
        dependencies:      ["EXEC-04"]
        output_files:      []   # [AGENT] key dirs/files written directly to project_root
        tech_context:      ""
        acceptance_criteria: ""

      # EXEC-06: Frontend Design — include if task involves frontend work (requires architecture-design)
      - exec_id:           "EXEC-06"
        exec_name:         "Frontend Design"
        exec_type:         "frontend-design"
        description:       ""   # [AGENT] Component tree, pages, state management, API integration plan
        target_artifacts:  []
        dependencies:      ["EXEC-01"]   # if backend-design is present, set to ["EXEC-04"]
        output_files:      [".ssdam/{id}/output/design/frontend-design.TSK-NNN.md"]
        tech_context:      ""
        acceptance_criteria: ""

      # EXEC-07: Frontend Implementation — include if frontend-design is included (requires frontend-design)
      - exec_id:           "EXEC-07"
        exec_name:         "Frontend Implementation"
        exec_type:         "frontend-implementation"
        description:       ""   # [AGENT] Agent implements frontend code in project_root per frontend-design spec
        target_artifacts:  []
        dependencies:      ["EXEC-06"]
        output_files:      []   # [AGENT] key dirs/files written directly to project_root
        tech_context:      ""
        acceptance_criteria: ""

    flow:
      default_sequence: ["EXEC-01", "EXEC-02", "EXEC-03", "EXEC-04", "EXEC-05", "EXEC-06", "EXEC-07"]
      parallel_groups:  []  # [AGENT] backend chain (EXEC-04~05) and frontend chain (EXEC-06~07) can run in parallel after EXEC-01

    execution_handoff:
      next_element:    "execution"
      execution_unit:  "step"
      total_steps:     0   # [AGENT] count of applicable steps (excluded steps not counted)


  # ----------------------------------------------------------
  # HANDOFF (to next Task)
  # ----------------------------------------------------------
  handoff:
    next_task_id:       ""   # [DERIVED] from mission-spec task_map — next TSK-NNN, or "END"
    handoff_artifacts:  []   # [AGENT] [ART-TSK-NNN-NN, ...] produced by this task
    handoff_evidence:   []   # [AGENT] [EVD-TSK-NNN-NN, ...] format


  # ----------------------------------------------------------
  # SELF-VALIDATION RESULT
  # ----------------------------------------------------------
  self_validation:
    passed:       true      # [AGENT] false if any hard check failed — never write false
    failed_checks: []       # [AGENT] list of failed check descriptions (warnings allowed)
