# Agent Reference Schema — do NOT edit
# This document describes the structure of the input files that the backend-design skill reads.

# TRIGGER COMMAND
# /backend-design <path-to-task-spec.yaml>
#
# EXAMPLE:
# /backend-design .ssdam/media-marketplace-20260221-001/output/task-spec.TSK-001.yaml

---

# SOURCE 1: task-spec.TSK-NNN.yaml
# This file is generated by the new-task step of the SSDAM pipeline.
# The backend-design skill reads these fields from the task-spec:

task_spec:
  metadata:
    # Mission identifier — copied to output document header
    # Format: "MIS-YYYYMMDD-NNN"
    mission_id: ""

    # Task identifier — used to derive output filename
    # Format: "TSK-NNN"
    task_id: ""

    # Human-readable task name — used as document title
    task_name: ""

    # Link to original requirement(s) for traceability
    requirement_ids: []

  # Output deliverables that this task must produce
  output_contract:
    # Each entry is a backend artifact or deliverable
    # The backend-design must account for all entries here
    # Example:
    # - output_artifact: "REST API"
    #   artifact_id: "MEDIA-UPLOAD-API"
    #   contract_specification: |
    #     - POST /api/v1/media/upload
    #     - GET /api/v1/media/{media_id}
    # - output_artifact: "Database Schema"
    #   artifact_id: "MEDIA-ENTITIES"
    #   contract_specification: |
    #     Tables: media_files
    - output_artifact: ""
      artifact_id: ""
      contract_specification: ""

  execution_plan:
    # Technology stack for this project
    tech_stack:
      # Backend framework, language, ORM, auth library
      # Example: "FastAPI, Pydantic, SqlModel, JWT"
      backend: ""

      # Database engine and version
      # Example: "PostgreSQL 15"
      database: ""

      # Absolute or relative path to project root
      # Example: "/home/user/projects/media-marketplace" or "./"
      project_root: ""

    # List of execution steps
    steps:
      # The backend-design skill will find the step where exec_type == "backend-design"
      # Example:
      # - exec_id: "EXEC-03"
      #   exec_type: "backend-design"
      #   description: "Design FastAPI backend with service/repository layers"
      #   acceptance_criteria: |
      #     - backend-design.TSK-001.md exists
      #     - All API endpoints are defined
      #     - Service layer design complete
      #
      - exec_id: ""
        exec_type: ""
        description: ""
        acceptance_criteria: ""

---

# SOURCE 2: architecture-design.TSK-NNN.md
# This file is produced by the architecture-design skill.
# The backend-design skill reads these sections from it:

architecture_design:
  # Technology stack (copied from task-spec)
  tech_stack:
    backend: ""
    database: ""
    project_root: ""

  # Module boundaries — defines which modules this task implements
  # The backend-design skill maps these to service layer classes
  module_boundaries:
    # Example:
    # - module: "Media Upload Service"
    #   responsibility: "Accept file uploads, validate, store, and return metadata"
    #   interfaces:
    #     - "POST /api/v1/media/upload"
    #     - "GET /api/v1/media/{media_id}"
    #   depends_on:
    #     - "Auth Service"
    #     - "File Storage (S3)"
    - module: ""
      responsibility: ""
      interfaces: []
      depends_on: []

  # API contract overview — REST endpoints created by this task
  # The backend-design skill expands these into full endpoint specifications
  api_contract_overview:
    # Example:
    # - endpoint: "POST /api/v1/media/upload"
    #   method: "POST"
    #   purpose: "Accept a file upload, validate, store, and return media metadata"
    #   request_summary: "multipart/form-data with file and metadata; Authorization header"
    #   response_summary: "201 Created with { media_id: UUID, url: string, size_bytes: integer }"
    - endpoint: ""
      method: ""
      purpose: ""
      request_summary: ""
      response_summary: ""

  # Domain entities — database entities created or modified by this task
  # The backend-design skill maps these to ORM models and repository classes
  domain_entities:
    # Example:
    # - entity: "MediaFile"
    #   table: "media_files"
    #   key_fields:
    #     - "id (UUID, primary key)"
    #     - "filename (string, 255)"
    #     - "mime_type (string)"
    #     - "size_bytes (integer)"
    #     - "storage_url (string)"
    #   relationships:
    #     - "belongs_to User"
    #     - "has_many Comment"
    - entity: ""
      table: ""
      key_fields: []
      relationships: []

---

# SOURCE 3: schema-design.TSK-NNN.sql (OPTIONAL)
# This file is produced by the schema-design skill (if run).
# The backend-design skill reads it to align Pydantic models with database schema.
# If this file does NOT exist, the backend-design skill proceeds without it.

schema_design:
  # Indicates whether schema-design was run for this task
  present: false

  # If present: true, these are the parsed table definitions
  tables:
    # Example:
    # - table_name: "media_files"
    #   columns:
    #     - name: "id"
    #       type: "UUID"
    #       nullable: false
    #       primary_key: true
    #       default: "gen_random_uuid()"
    #     - name: "filename"
    #       type: "VARCHAR(255)"
    #       nullable: false
    #     - name: "user_id"
    #       type: "UUID"
    #       nullable: false
    #       foreign_key: "users(id)"
    - table_name: ""
      columns: []

---

# FIELD USAGE BY THE backend-design SKILL:
#
# REQUIRED (pre-execution verification):
#   - metadata.task_id (to name output file)
#   - output_contract (must contain at least one backend artifact)
#   - execution_plan.tech_stack.backend (framework must be configured)
#   - execution_plan.tech_stack.database (if entities exist in architecture-design)
#   - execution_plan.tech_stack.project_root (for file structure planning)
#   - [from architecture-design] api_contract_overview (must be non-empty)
#   - [from architecture-design] module_boundaries (must be non-empty)
#
# USED IN DESIGN:
#   - metadata.mission_id (document header)
#   - metadata.task_name (document title)
#   - metadata.requirement_ids (for traceability)
#   - output_contract (to verify all deliverables are covered)
#   - execution_plan.tech_stack (for tech stack section)
#   - [from architecture-design] api_contract_overview (to define endpoints)
#   - [from architecture-design] module_boundaries (to define services)
#   - [from architecture-design] domain_entities (to define repositories and ORM models)
#   - [from schema-design] tables (to align Pydantic models with schema)
#
# OPTIONAL:
#   - [schema-design] — if not present, backend-design proceeds without schema alignment
#     (SQLModel ORM models will be inferred from domain_entities)
