# Agent Reference Schema — do NOT edit
# This document describes the structure of the input files that the backend-implementation skill reads.

# TRIGGER COMMAND
# /backend-implementation <path-to-task-spec.yaml>
#
# EXAMPLE:
# /backend-implementation .ssdam/media-marketplace-20260221-001/output/task-spec.TSK-001.yaml

---

# SOURCE 1: task-spec.TSK-NNN.yaml
# This file is generated by the new-task step of the SSDAM pipeline.
# The backend-implementation skill reads these fields:

task_spec:
  metadata:
    # Task identifier — for logging and traceability
    task_id: ""

    # Human-readable task name — for logging and documentation
    task_name: ""

    # Link to original requirement(s) for traceability in code comments
    requirement_ids: []

  execution_plan:
    # Technology stack for this project
    tech_stack:
      # Backend framework and libraries
      # Example: "FastAPI, Pydantic, SqlModel, JWT"
      backend: ""

      # Database engine and version
      # Example: "PostgreSQL 15"
      database: ""

      # Absolute or relative path to project root
      # Example: "/home/user/projects/media-marketplace" or "./"
      project_root: ""

    # List of execution steps
    steps:
      # The backend-implementation skill will find the step where exec_type == "backend-implementation"
      # Example:
      # - exec_id: "EXEC-04"
      #   exec_type: "backend-implementation"
      #   description: "Implement FastAPI backend code"
      #   acceptance_criteria: |
      #     - All endpoints from backend-design are implemented
      #     - All tests pass
      #     - Code follows conventions
      #
      - exec_id: ""
        exec_type: ""
        description: ""
        acceptance_criteria: ""

---

# SOURCE 2: backend-design.TSK-NNN.md
# This file is produced by the backend-design skill.
# The backend-implementation skill reads these sections from it:

backend_design:
  # All API endpoints to implement
  api_endpoints:
    # Example:
    # - method: "POST"
    #   path: "/api/v1/media/upload"
    #   description: "Upload a new media file"
    #   auth_required: true
    #   request_schema: "MediaFileCreate"
    #   response_schema: "MediaFileResponse"
    #   status_codes:
    #     success: 201
    #     errors: [400, 401, 422]
    - method: ""
      path: ""
      description: ""
      auth_required: false
      request_schema: ""
      response_schema: ""
      status_codes: {}
      requirement_ids: []

  # All Pydantic request/response schemas
  schemas:
    # Example:
    # - schema_name: "MediaFileCreate"
    #   schema_type: "request"
    #   fields:
    #     - name: "filename"
    #       type: "str"
    #       required: true
    #       validation: "min_length=1, max_length=255"
    #       description: "Name of the uploaded file"
    - schema_name: ""
      schema_type: ""
      fields: []

  # All service classes to implement
  services:
    # Example:
    # - service_name: "MediaFileService"
    #   file: "src/services/media_file_service.py"
    #   responsibility: "Manage media file operations"
    #   dependencies: ["MediaFileRepository"]
    #   methods:
    #     - name: "create_media_file"
    #       params: ["file_id: UUID", "user_id: UUID", "data: MediaFileCreate"]
    #       return_type: "MediaFileResponse"
    #       description: "Create a new media file"
    - service_name: ""
      file: ""
      responsibility: ""
      dependencies: []
      methods: []

  # All repository classes to implement (data access layer)
  repositories:
    # Example:
    # - repo_name: "MediaFileRepository"
    #   entity: "MediaFile"
    #   file: "src/repositories/media_file_repository.py"
    #   methods:
    #     - name: "create"
    #       params: ["session: AsyncSession", "data: MediaFileCreate"]
    #       return_type: "MediaFile"
    #       query_type: "insert"
    #       description: "Create a new record"
    - repo_name: ""
      entity: ""
      file: ""
      methods: []

  # Error handling specification
  error_handling:
    exception_classes: []
      # Example:
      # - class_name: "ResourceNotFoundError"
      #   http_status_code: 404
      #   message_template: "{entity_type} with ID {id} not found"

    http_mapping: {}
      # Example:
      # ResourceNotFoundError: 404
      # UnauthorizedError: 401

    error_response_schema: ""
      # Example:
      # {
      #   "error_code": "RESOURCE_NOT_FOUND",
      #   "message": "...",
      #   "status_code": 404,
      #   "timestamp": "2026-02-21T10:30:00Z"
      # }

  # Authentication specification
  authentication:
    scheme: ""          # e.g., "JWT Bearer Token"
    token_type: ""      # e.g., "JWT"
    token_location: ""  # e.g., "Authorization header"
    token_payload: []   # e.g., ["sub (user_id)", "exp (expiration)"]
    validation_method: ""  # e.g., "FastAPI Depends(get_current_user)"
    protected_endpoints: []

  # Middleware and cross-cutting concerns
  middleware:
    cors_enabled: false
    cors_origins: []
    rate_limiting: false
    request_logging: false

  # File structure (directories and files to create)
  file_structure:
    # Example:
    # - path: "src/api/v1/media_files.py"
    #   description: "FastAPI router for media endpoints"
    #   type: "file"
    - path: ""
      description: ""
      type: ""

  # Test strategy
  test_strategy:
    unit_tests:
      location: ""       # e.g., "tests/unit/services/"
      coverage: ""       # What is unit tested
      example_tests: []
    integration_tests:
      location: ""       # e.g., "tests/integration/api/"
      coverage: ""       # What is integration tested
      example_tests: []
    target_coverage: ""  # e.g., ">80%"

---

# SOURCE 3: schema-design.TSK-NNN.sql (OPTIONAL)
# This file is produced by the schema-design skill (if run).
# The backend-implementation skill reads it to generate database migrations.

schema_design:
  # Indicates whether schema-design was run
  present: false

  # If present: true, these are the parsed CREATE TABLE statements
  tables:
    # Example:
    # - table_name: "media_files"
    #   columns:
    #     - name: "id"
    #       type: "UUID"
    #       nullable: false
    #       primary_key: true
    #     - name: "filename"
    #       type: "VARCHAR(255)"
    #       nullable: false
    - table_name: ""
      columns: []

---

# FIELD USAGE BY THE backend-implementation SKILL:
#
# REQUIRED (pre-execution verification):
#   - metadata.task_id (for logging)
#   - execution_plan.tech_stack.backend (framework)
#   - execution_plan.tech_stack.database (database type)
#   - execution_plan.tech_stack.project_root (where to write code)
#   - execution_plan.steps[exec_type="backend-implementation"].acceptance_criteria
#   - [from backend-design] api_endpoints (all endpoints to implement)
#   - [from backend-design] schemas (all schemas to implement)
#   - [from backend-design] services (all service classes)
#   - [from backend-design] repositories (all repository classes)
#   - [from backend-design] error_handling (exception handling)
#   - [from backend-design] file_structure (where each file goes)
#   - [from backend-design] test_strategy (what tests to write)
#
# USED IN IMPLEMENTATION:
#   - metadata.task_name (for logging and documentation)
#   - metadata.requirement_ids (for code comments and test names)
#   - execution_plan.tech_stack (for imports and configuration)
#   - [from backend-design] all sections above (detailed code specs)
#   - [from backend-design] authentication (JWT setup)
#   - [from backend-design] middleware (CORS, rate limiting)
#   - [from schema-design] tables (for database migrations)
#
# OPTIONAL:
#   - [schema-design] — if not present, implementation proceeds without migrations
#     (SQLModel ORM models will be created and used with init_db())
