# Schema-Design Skill Output Schema Template
#
# This document defines the structure of the schema-design output file:
# .ssdam/{id}/output/design/schema-design.TSK-NNN.sql
#
# The output is a SQL script file containing DDL statements (CREATE TABLE, INDEX, etc.)
# that can be directly executed against PostgreSQL to set up the database schema.
#
# NOTE: This is a REFERENCE SCHEMA showing the LOGICAL STRUCTURE of the SQL output.
# The actual output file is plain SQL text, not YAML, but organized in sections
# as shown below.

---

# ============================================================================
# OUTPUT FILE METADATA (as comments in SQL)
# ============================================================================

output_type: "SQL DDL Script"
file_name: "schema-design.TSK-NNN.sql"
output_path: ".ssdam/{id}/output/design/schema-design.TSK-NNN.sql"

# Logical structure represented as comments in the SQL file:
header_comment: |
  -- ========================================================================
  -- Schema Design for TSK-NNN: [Task Name]
  -- ========================================================================
  -- Generated from: data-modeling.TSK-NNN.md
  -- Task ID: TSK-NNN
  -- Mission ID: MIS-...
  -- Generated: YYYY-MM-DDTHH:mm:ssZ
  --
  -- This file contains all DDL statements (CREATE TABLE, CREATE INDEX)
  -- needed to set up the database schema for this task.
  --
  -- How to apply:
  --   psql -d database_name -f schema-design.TSK-NNN.sql
  -- ========================================================================

# ============================================================================
# SQL SECTIONS
# ============================================================================

sql_sections:

  # Section 1: Prerequisites / Extensions
  - section_name: "Prerequisites / Extensions"
    description: "Ensure required PostgreSQL extensions are available"
    example_sql: |
      -- ========================================================================
      -- Prerequisites / Extensions
      -- ========================================================================
      CREATE EXTENSION IF NOT EXISTS pgcrypto;  -- For gen_random_uuid()

  # Section 2: Tables (in dependency order)
  - section_name: "Tables (in dependency order: referenced tables first)"
    description: |
      CREATE TABLE statements for all entities from data-modeling,
      ordered by foreign key dependencies (tables without FKs first).
    example_sql: |
      -- ========================================================================
      -- Tables (in dependency order: referenced tables first)
      -- ========================================================================

      CREATE TABLE users (
        id UUID PRIMARY KEY DEFAULT gen_random_uuid(),
        email VARCHAR(255) NOT NULL UNIQUE,
        password_hash VARCHAR(255) NOT NULL,
        created_at TIMESTAMPTZ NOT NULL DEFAULT NOW(),
        updated_at TIMESTAMPTZ NOT NULL DEFAULT NOW()
      );

      CREATE TABLE media_files (
        id UUID PRIMARY KEY DEFAULT gen_random_uuid(),
        owner_id UUID NOT NULL REFERENCES users(id) ON DELETE CASCADE,
        filename VARCHAR(255) NOT NULL,
        mime_type VARCHAR(100) NOT NULL,
        size_bytes INTEGER NOT NULL,
        storage_url TEXT NOT NULL,
        is_public BOOLEAN NOT NULL DEFAULT false,
        created_at TIMESTAMPTZ NOT NULL DEFAULT NOW(),
        updated_at TIMESTAMPTZ NOT NULL DEFAULT NOW()
      );

      CREATE TABLE comments (
        id UUID PRIMARY KEY DEFAULT gen_random_uuid(),
        media_id UUID NOT NULL REFERENCES media_files(id) ON DELETE CASCADE,
        author_id UUID NOT NULL REFERENCES users(id) ON DELETE CASCADE,
        content TEXT NOT NULL,
        created_at TIMESTAMPTZ NOT NULL DEFAULT NOW(),
        updated_at TIMESTAMPTZ NOT NULL DEFAULT NOW()
      );

      CREATE TABLE tags (
        id UUID PRIMARY KEY DEFAULT gen_random_uuid(),
        name VARCHAR(100) NOT NULL UNIQUE,
        description TEXT,
        created_at TIMESTAMPTZ NOT NULL DEFAULT NOW(),
        updated_at TIMESTAMPTZ NOT NULL DEFAULT NOW()
      );

  # Section 3: Junction Tables
  - section_name: "Junction Tables (for many-to-many relationships)"
    description: |
      CREATE TABLE statements for junction/associative tables
      that implement many-to-many relationships.
    example_sql: |
      -- ========================================================================
      -- Junction Tables (for many-to-many relationships)
      -- ========================================================================

      CREATE TABLE comment_tags (
        comment_id UUID NOT NULL REFERENCES comments(id) ON DELETE CASCADE,
        tag_id UUID NOT NULL REFERENCES tags(id) ON DELETE CASCADE,
        created_at TIMESTAMPTZ NOT NULL DEFAULT NOW(),
        PRIMARY KEY (comment_id, tag_id)
      );

  # Section 4: Indexes
  - section_name: "Indexes (on FK and search columns)"
    description: |
      CREATE INDEX statements for:
      - Foreign key columns (join performance)
      - Search columns (WHERE clause filters)
      - Sort columns (ORDER BY performance)
      - Unique constraints (enforce uniqueness)
    example_sql: |
      -- ========================================================================
      -- Indexes (on FK and search columns)
      -- ========================================================================

      -- Foreign key indexes (required for JOIN performance)
      CREATE INDEX idx_media_files_owner_id ON media_files(owner_id);
      CREATE INDEX idx_comments_media_id ON comments(media_id);
      CREATE INDEX idx_comments_author_id ON comments(author_id);
      CREATE INDEX idx_comment_tags_comment_id ON comment_tags(comment_id);
      CREATE INDEX idx_comment_tags_tag_id ON comment_tags(tag_id);

      -- Search/filter indexes (for WHERE clause columns)
      CREATE INDEX idx_media_files_filename ON media_files(filename);
      CREATE INDEX idx_tags_name ON tags(name);

      -- Sort/order indexes (for ORDER BY columns)
      CREATE INDEX idx_media_files_created_at ON media_files(created_at);
      CREATE INDEX idx_comments_created_at ON comments(created_at);

      -- Unique constraint indexes
      CREATE UNIQUE INDEX idx_users_email_unique ON users(email);
      CREATE UNIQUE INDEX idx_tags_name_unique ON tags(name);

  # Section 5: Optional Triggers (for updated_at auto-update)
  - section_name: "Triggers (if needed: auto-update updated_at timestamp)"
    description: |
      Optional trigger functions to automatically update the updated_at
      timestamp on every UPDATE. Include if your ORM/application does not
      handle this automatically.
    example_sql: |
      -- ========================================================================
      -- Triggers (if needed: auto-update updated_at timestamp)
      -- ========================================================================
      --
      -- Optional: If your ORM/application does NOT automatically update
      -- the updated_at timestamp on every UPDATE, uncomment and use these:
      --
      -- CREATE OR REPLACE FUNCTION update_updated_at_column()
      -- RETURNS TRIGGER AS $$
      -- BEGIN
      --   NEW.updated_at = NOW();
      --   RETURN NEW;
      -- END;
      -- $$ LANGUAGE plpgsql;
      --
      -- CREATE TRIGGER update_media_files_updated_at
      -- BEFORE UPDATE ON media_files
      -- FOR EACH ROW
      -- EXECUTE FUNCTION update_updated_at_column();
      --
      -- CREATE TRIGGER update_comments_updated_at
      -- BEFORE UPDATE ON comments
      -- FOR EACH ROW
      -- EXECUTE FUNCTION update_updated_at_column();
      --
      -- CREATE TRIGGER update_users_updated_at
      -- BEFORE UPDATE ON users
      -- FOR EACH ROW
      -- EXECUTE FUNCTION update_updated_at_column();
      --
      -- CREATE TRIGGER update_tags_updated_at
      -- BEFORE UPDATE ON tags
      -- FOR EACH ROW
      -- EXECUTE FUNCTION update_updated_at_column();

# ============================================================================
# QUALITY CHECKLIST (validated before writing)
# ============================================================================

quality_checks:
  - check: "All entities from data-modeling have CREATE TABLE statements"
    result: "PASS"
  - check: "All primary keys use UUID with gen_random_uuid()"
    result: "PASS"
  - check: "All tables have created_at and updated_at columns"
    result: "PASS"
  - check: "All FK columns have REFERENCES constraints"
    result: "PASS"
  - check: "All FK columns have corresponding indexes"
    result: "PASS"
  - check: "All junction tables have compound primary keys"
    result: "PASS"
  - check: "All field types are valid PostgreSQL types"
    result: "PASS"
  - check: "All table/column names follow snake_case convention"
    result: "PASS"
  - check: "Tables are in dependency order (no forward references)"
    result: "PASS"
  - check: "SQL syntax is valid (no parsing errors)"
    result: "PASS"

# ============================================================================
# USAGE INSTRUCTIONS (in SQL comments)
# ============================================================================

execution_instructions: |
  To apply this schema to your PostgreSQL database:

  1. Verify database connection:
     psql -h localhost -U postgres -d database_name

  2. Execute the schema DDL:
     psql -d database_name -f schema-design.TSK-NNN.sql

  3. Verify tables were created:
     \dt  (in psql)
     or: SELECT tablename FROM pg_tables WHERE schemaname='public';

  4. Verify indexes were created:
     \di  (in psql)
     or: SELECT indexname FROM pg_indexes WHERE schemaname='public';

  Notes:
  - This script is idempotent (CREATE ... IF NOT EXISTS where applicable)
  - Foreign key constraints are set to ON DELETE CASCADE
  - All timestamps are TIMESTAMPTZ (timezone-aware)
  - All IDs are UUID with automatic generation
  - pgcrypto extension is required (CREATE EXTENSION IF NOT EXISTS pgcrypto)

# ============================================================================
# INTEGRATION WITH OTHER SKILLS
# ============================================================================

downstream_dependencies: |
  This schema-design output is consumed by:

  1. backend-design
     - Reads this schema as the authoritative DB contract
     - Uses table/column names to generate ORM models
     - Generates type-safe data access layer

  2. backend-implementation
     - Uses schema-design.TSK-NNN.sql to set up test database
     - References schema in API documentation
     - Validates ORM models against schema

  3. Database administrators
     - Use schema-design.TSK-NNN.sql to provision production database
     - Track schema changes via version control (this file is committed)
     - Generate migration scripts (comparing TSK-NNN with subsequent versions)

