# ============================================================
# input.template.yaml — Agent Reference Schema
# ============================================================
#
# ⚠️  DO NOT EDIT THIS FILE DIRECTLY.
#
# This file is the schema reference used by the new-mission AgentSkill.
# The agent uses it to know what fields to populate when generating
# the actual input file at:
#   .ssdam/{id}/input/mission-input.yaml
#
# HOW IT WORKS:
#   1. User runs: /new-mission [idea or feature list]
#   2. Agent auto-detects project context (stack, paths, git owner)
#   3. Agent asks minimal questions for anything it cannot detect
#   4. Agent generates .ssdam/{id}/input/mission-input.yaml
#      using this file as the field schema
#   5. Agent shows the generated file and asks for confirmation
#   6. Agent proceeds to generate mission-spec.yaml
#
# FIELD RULES (for the agent):
#   - Set undetectable fields to "undefined" — never guess or infer
#   - idea: copy verbatim from user command (no restructuring yet)
#   - project_root / ssdam_root: always use absolute paths
#   - team: empty list [] if user skips
#   - constraints: all fields "undefined" if user skips
# ============================================================


# ------------------------------------------------------------
# FIELD: idea
# ------------------------------------------------------------
# Source: verbatim text from `/new-mission [text]` command.
# The agent copies the user's input exactly — no restructuring.
# Structuring happens in Phase 1-2 (goal + requirements).
# ------------------------------------------------------------
idea: |
  <verbatim text from /new-mission command>


# ------------------------------------------------------------
# FIELD: mission_owner
# ------------------------------------------------------------
# Source: `git config user.name` (auto-detected).
# Fallback: agent asks the user if git config is unavailable.
# ------------------------------------------------------------
mission_owner: "<git config user.name or user-provided>"


# ------------------------------------------------------------
# FIELD: project_context
# ------------------------------------------------------------
# Source: auto-detected by agent scanning the project root.
# Fields that cannot be detected are set to "undefined".
# Agent NEVER infers or guesses — only records what is found.
# ------------------------------------------------------------
project_context:
  backend_stack:  "<detected from package.json / requirements.txt / pom.xml / go.mod / etc. — or 'undefined'>"
  frontend_stack: "<detected from package.json dependencies — or 'undefined'>"
  database:       "<detected from package.json / docker-compose / ORM config / .env — or 'undefined'>"
  project_root:   "<absolute path — current working directory>"
  ssdam_root:     "<absolute path — {project_root}/.ssdam>"


# ------------------------------------------------------------
# FIELD: team
# ------------------------------------------------------------
# Source: agent asks once — "Team members? name:role, name:role"
# If user skips (presses Enter), this is set to [].
# Roles: developer | reviewer | architect | qa | devops | lead
# ------------------------------------------------------------
team:
  - name: "<name>"
    role: "<role>"
  # [] if user skipped


# ------------------------------------------------------------
# FIELD: constraints
# ------------------------------------------------------------
# Source: agent asks once — "Any hard constraints?"
# ONLY what the user explicitly states is recorded here.
# All fields default to "undefined" if user skips.
# Agent NEVER infers constraints from tech stack or team size.
# ------------------------------------------------------------
constraints:
  timeline:    "<user-stated — or 'undefined'>"
  budget:      "<user-stated — or 'undefined'>"
  regulatory:  "<user-stated — or 'undefined'>"
  performance: "<user-stated — or 'undefined'>"
  security:    "<user-stated — or 'undefined'>"
  other:       "<user-stated — or 'undefined'>"
