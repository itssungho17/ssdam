# ============================================================
# mission-spec.yaml — Output Template for new-mission Skill
# ============================================================
#
# This file is GENERATED by the new-mission AgentSkill.
# Do NOT edit this template directly.
#
# Actual output location:
#   .ssdam/{id}/output/mission-spec.yaml
#
# This file becomes the INPUT for the next skill:
#   templetes/new-task/SKILL.md
#
# All fields marked [AGENT] are populated by the agent.
# All fields marked [DERIVED] are computed from input.
# ============================================================


mission_spec:

  # ----------------------------------------------------------
  # METADATA
  # ----------------------------------------------------------
  metadata:
    mission_id:     "MIS-YYYYMMDD-NNN"   # [AGENT] e.g., MIS-20260221-001
    mission_owner:  ""                    # [DERIVED] from input.mission_owner
    domain:         ""                    # [AGENT] backend | frontend | data | infra | fullstack
    created_at:     ""                    # [AGENT] ISO-8601 UTC e.g., 2026-02-21T09:00:00Z
    schema_version: "1.0.0"


  # ----------------------------------------------------------
  # IDEA VALIDATION
  # ----------------------------------------------------------
  idea_validation:
    status: "COMPLETE"                    # COMPLETE | INCOMPLETE
    clarifying_questions: []              # Populated only if status is INCOMPLETE
    # If INCOMPLETE, the agent stops here and outputs only this block.


  # ----------------------------------------------------------
  # GOAL
  # ----------------------------------------------------------
  goal:
    statement: ""                         # [AGENT] Single testable sentence
    success_criteria:
      - id: "SC-001"
        criterion: ""                     # Binary PASS/FAIL verifiable condition
      - id: "SC-002"
        criterion: ""


  # ----------------------------------------------------------
  # REQUIREMENTS
  # ----------------------------------------------------------
  # Every requirement must map to at least one Task.
  # Every requirement must be PASS/FAIL verifiable.
  requirements:
    - id:         "REQ-001"
      statement:  ""                      # [AGENT] Specific, testable requirement
      type:       "functional"            # functional | non_functional
      verifiable: true

    - id:         "REQ-002"
      statement:  ""
      type:       "non_functional"
      verifiable: true

    # Add more REQ-NNN entries as needed


  # ----------------------------------------------------------
  # TASKS
  # ----------------------------------------------------------
  # Each Task is a discrete unit of work with a checkpoint.
  # Tasks are executed by the new-task skill in dependency order.
  tasks:
    - id:           "TSK-001"
      name:         ""                    # Short descriptive name
      purpose:      ""                    # One sentence: what this task delivers
      requirements: ["REQ-001"]           # Which requirements this task satisfies
      initial_state: "PENDING"            # Always PENDING at creation
      checkpoint:
        id:       "CP-TSK-001"
        criteria: ""                      # Binary condition: what defines PASS
      artifact:
        description: ""                   # What file/output/change this task produces
      dependencies: []                    # List of TSK-NNN IDs this task depends on

    - id:           "TSK-002"
      name:         ""
      purpose:      ""
      requirements: ["REQ-001", "REQ-002"]
      initial_state: "PENDING"
      checkpoint:
        id:       "CP-TSK-002"
        criteria: ""
      artifact:
        description: ""
      dependencies: ["TSK-001"]

    # Add more TSK-NNN entries as needed


  # ----------------------------------------------------------
  # GOVERNANCE
  # ----------------------------------------------------------
  governance:
    roles:
      mission_owner: ""                   # [DERIVED] from input.mission_owner
      task_owners:
        TSK-001: ""                       # Assigned from input.team
        TSK-002: ""
      reviewers: []                       # Names/roles from input.team

    gates:
      - id:       "GATE-TSK-001"
        task_id:  "TSK-001"
        criteria: ""                      # What must be true for this gate to open

      - id:       "GATE-TSK-002"
        task_id:  "TSK-002"
        criteria: ""

    escalation:
      repeated_failure_threshold: 3       # [AGENT] N consecutive FAILs → escalate
      blocked_duration_threshold: "24h"   # [AGENT] BLOCKED for this long → escalate
      escalation_target: ""               # Role or name from governance.roles.reviewers


  # ----------------------------------------------------------
  # TASK MAP
  # ----------------------------------------------------------
  task_map:
    dependency_graph:
      - from: "TSK-001"
        to:   "TSK-002"
        type: "sequential"                # sequential | parallel | conditional

    branch_rules: []                      # Conditional branching rules, if any

    critical_path: ["TSK-001", "TSK-002"] # [AGENT] Longest sequential chain


  # ----------------------------------------------------------
  # POLICIES
  # ----------------------------------------------------------
  policies:

    quality:
      id: "QPOL-01"
      rules:
        - ""                              # e.g., "All tasks must produce at least one artifact"
        - ""                              # e.g., "Artifacts must pass linting before checkpoint"

    recovery:
      id: "RPOL-01"
      strategies:
        - condition: "First FAIL on any task"
          action:    "retry"              # retry | partial_fix | task_redesign
          max_attempts: 2

        - condition: "Second consecutive FAIL"
          action:    "partial_fix"
          max_attempts: 1

        - condition: "Third consecutive FAIL or structural collapse"
          action:    "task_redesign"
          max_attempts: 1

    traceability:
      id: "TPOL-01"
      required_chain: >
        Requirement → Task → Execution → Artifact → Evaluation → Evidence → Checkpoint
      rules:
        - "Every artifact must reference its source task_id and requirement_ids"
        - "Every checkpoint must reference its evaluation_id"
        - "No task may be marked PASS without a recorded checkpoint"


  # ----------------------------------------------------------
  # PROJECT CONTEXT
  # ----------------------------------------------------------
  # Propagated verbatim from mission-input.yaml.project_context.
  # Agent does NOT infer — if a field was not auto-detected, it stays "undefined".
  # This section is the authoritative tech stack source for new-task.
  project_context:
    backend_stack: ""               # [DERIVED] from input.project_context.backend_stack
    frontend_stack: ""              # [DERIVED] from input.project_context.frontend_stack
    database: ""                    # [DERIVED] from input.project_context.database
    project_root: ""                # [DERIVED] from input.project_context.project_root


  # ----------------------------------------------------------
  # CONSTRAINTS
  # ----------------------------------------------------------
  # Recorded verbatim from input. Agent does NOT infer.
  constraints:
    timeline:    ""
    budget:      ""
    regulatory:  ""
    performance: ""
    security:    ""
    other:       ""


  # ----------------------------------------------------------
  # HANDOFF
  # ----------------------------------------------------------
  # Directs the next AgentSkill to execute.
  handoff:
    next_template: "new-task"
    payload:
      mission_id:       "MIS-YYYYMMDD-NNN"
      task_list:        ["TSK-001", "TSK-002"]   # Ordered by dependency
      requirement_ids:  ["REQ-001", "REQ-002"]
    instruction: >
      Execute the new-task skill for each task in task_list, in dependency order.
      Read .ssdam/{id}/output/mission-spec.yaml as the input source.
      Create a separate Task-Spec for each TSK-NNN.


  # ----------------------------------------------------------
  # SELF-VALIDATION RESULT
  # ----------------------------------------------------------
  self_validation:
    passed:       true                    # [AGENT] false if any check failed
    failed_checks: []                     # List of failed check descriptions
    # Agent must fix all failures before writing this file.
    # A mission-spec.yaml with passed: false must never be written.
