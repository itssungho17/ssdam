# Agent Reference Schema — do NOT edit
# This document describes the structure of the input task-spec.yaml file
# that the architecture-design skill reads.

# TRIGGER COMMAND
# /architecture-design <path-to-task-spec.yaml>
#
# EXAMPLE:
# /architecture-design .ssdam/media-marketplace-20260221-001/output/task-spec.TSK-001.yaml

---

# Source: task-spec.TSK-NNN.yaml
# This file is generated by the new-task step of the SSDAM pipeline.
# The architecture-design skill reads ALL of these fields to produce the design document.

metadata:
  # Mission identifier — copied to output document header
  # Format: "MIS-YYYYMMDD-NNN"
  # Example: "MIS-20260221-001"
  mission_id: ""

  # Task identifier — used to derive output filename
  # Format: "TSK-NNN" where NNN is a zero-padded number
  # Example: "TSK-001", "TSK-042"
  task_id: ""

  # Human-readable task name — used as document title
  # Example: "Build Media Upload API"
  task_name: ""

  # Person or team responsible for this task
  task_owner: ""

  # Link to original requirement(s) in requirements management system
  # Used for traceability to upstream specifications
  requirement_ids: []

purpose:
  # One-sentence goal of this task
  # Example: "Enable users to upload media files and retrieve them via REST API"
  statement: ""

  # List of what IS in scope for this task
  # Everything here MUST appear in the architecture design document
  # Example items:
  #   - "Upload API endpoint (POST /api/v1/media/upload)"
  #   - "Media database entities (MediaFile, Tag, Comment)"
  #   - "File storage integration (S3)"
  #   - "Upload form component with progress bar"
  scope_included: []

  # List of what is NOT in scope for this task
  # Used as guard rails — prevents scope creep
  # Example items:
  #   - "Authentication (covered by separate Auth Service)"
  #   - "Video transcoding pipeline"
  #   - "Advanced image filters"
  scope_excluded: []

# Output deliverables that this task must produce
# Each entry is a specific artifact that the architecture must account for
output_contract:
  # Each deliverable has:
  # - output_artifact: type of artifact (e.g., "REST API", "React Component", "Database Schema")
  # - artifact_id: identifier for this artifact (e.g., "MEDIA-UPLOAD-API", "UPLOAD-FORM-COMPONENT")
  # - contract_specification: detailed specification of what this artifact must contain
  #   (fields, endpoints, component props, schema, etc.)
  #
  # Example:
  # - output_artifact: "REST API"
  #   artifact_id: "MEDIA-UPLOAD-API"
  #   contract_specification: |
  #     - POST /api/v1/media/upload
  #       Accepts multipart/form-data with file and metadata
  #       Returns: { media_id: UUID, url: string, size_bytes: integer }
  #     - GET /api/v1/media/{media_id}
  #       Returns media metadata
  #
  # - output_artifact: "React Component"
  #   artifact_id: "UPLOAD-FORM-COMPONENT"
  #   contract_specification: |
  #     Props: { onUploadComplete: Function, maxFileSize: number }
  #     Exports: <UploadForm /> component
  #
  # - output_artifact: "Database Schema"
  #   artifact_id: "MEDIA-ENTITIES"
  #   contract_specification: |
  #     Tables: media_files, media_tags, uploads
  #     Primary entities: MediaFile (id, filename, mime_type, size_bytes, storage_url)
  - output_artifact: ""
    artifact_id: ""
    contract_specification: ""

execution_plan:
  # Technology stack for this project
  tech_stack:
    # Backend framework, language, ORM, auth library
    # Example: "FastAPI, Pydantic, SqlModel, JWT"
    backend: ""

    # Frontend framework, CSS framework, UI library
    # Example: "Svelte, TailwindCSS, Shadcn"
    frontend: ""

    # Database engine and version
    # Example: "PostgreSQL 15"
    database: ""

    # Absolute or relative path to project root
    # Example: "/home/user/projects/media-marketplace" or "./"
    project_root: ""

  # List of execution steps for this task
  # Organized by execution skill (architecture-design, data-modeling, etc.)
  steps:
    # The architecture-design skill will find and read the step where exec_type == "architecture-design"
    # Example step:
    # - exec_id: "EXEC-01"
    #   exec_type: "architecture-design"
    #   description: |
    #     Design the system architecture for media upload capability.
    #     Identify modules, component boundaries, data flows, and API contracts.
    #   acceptance_criteria: |
    #     - architecture-design.TSK-001.md exists in .ssdam/{id}/output/design/
    #     - File includes Mermaid component diagram
    #     - All scope_included items are addressed
    #     - All output_contract deliverables are traceable
    #
    - exec_id: ""
      exec_type: ""  # architecture-design, data-modeling, backend-design, etc.
      description: ""
      acceptance_criteria: ""

# Summary of field usage by the architecture-design skill:
#
# REQUIRED (pre-execution verification):
#   - metadata.task_id (to name output file)
#   - purpose.statement (for overview)
#   - purpose.scope_included (must all appear in design)
#   - output_contract (must be non-empty)
#   - execution_plan.steps[exec_type="architecture-design"] (must exist)
#
# USED IN DESIGN:
#   - metadata.mission_id (document header)
#   - metadata.task_name (document title)
#   - purpose.statement (overview goal)
#   - purpose.scope_included (scope summary, coverage verification)
#   - purpose.scope_excluded (scope guard rails)
#   - output_contract (module and endpoint identification)
#   - execution_plan.tech_stack (document tech stack section)
#   - execution_plan.steps[exec_type="architecture-design"].description (context for design)
#
# OPTIONAL (metadata only):
#   - metadata.task_owner (document metadata)
#   - metadata.requirement_ids (traceability)
